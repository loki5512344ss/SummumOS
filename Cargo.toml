[package]
name = "helloos"
version = "0.1.0"
authors = ["nobody <nobody@localhost>"]
edition = "2015"
default-run = "helloos"
license-file = "LICENSE"

[[bin]]
name = "helloos"
path = "src/main.rs"

[[bin]]
name = "mkvideo"
path = "tools/mkvideo.rs"

[[bin]]
name = "mkaudio"
path = "tools/mkaudio.rs"

[[bin]]
name = "embed_video"
path = "tools/embed_video.rs"

[[bin]]
name = "mkfont"
path = "tools/mkfont.rs"

[[bin]]
name = "mkcodec"
path = "tools/mkcodec.rs"

[[bin]]
name = "mkbadapple"
path = "tools/mkbadapple.rs"

[[bin]]
name = "mkcolorvideo"
path = "tools/mkcolorvideo.rs"

[[bin]]
name = "sndcmp"
path = "tools/sndcmp.rs"

[[bin]]
name = "seal"
path = "tools/seal.rs"

[[bin]]
name = "nasos"
path = "tools/nasos_dlya_tapka.rs"

[profile.release]
opt-level = 1
