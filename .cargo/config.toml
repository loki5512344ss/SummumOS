# Настройки сборки. Лежат тут, а не в чьей-то голове.
#
# Главный враг -- память. В данных сотни мегабайт строковых литералов, и
# обычный релиз параллелит кодоген на 16 кусков: rustc раздувается до
# 8 гигабайт и убивает десктоп. Один кодоген-юнит и мало джоб держат пик
# низко, а сборка от этого почему-то ещё и быстрее. Жёсткий лимит
# сверху -- в build.sh.
[build]
jobs = 4

[profile.release]
codegen-units = 1
